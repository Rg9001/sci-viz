<meta charset="utf-8">
<div id="root">
  <div id="title"></div>
  <div id="stage"></div>
  <div id="caption"></div>
  <div id="err"></div>
</div>

<style>
  :root { --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --card:#f6f7f9; --line:#e3e5e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e20; --fg:#f2f2f2; --muted:#a1a1a6; --card:#2a2a2d; --line:#3a3a3d; }
  }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #root { padding:14px; }
  #title { font-weight:600; font-size:15px; margin-bottom:8px; }
  #caption { color:var(--muted); font-size:13px; margin-top:8px; line-height:1.4; }
  #err { color:#d70015; font-size:13px; white-space:pre-wrap; }
  #stage { display:flex; flex-wrap:wrap; gap:12px; }
  .mol { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px; flex:1 1 240px; min-width:220px; text-align:center; }
  .mol svg { width:100%; height:240px; }
  .mol .name { font-size:13px; color:var(--muted); margin-top:4px; }
  .rxn { width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .rxn svg { width:100%; height:260px; }
  .plot { width:100%; height:420px; }
  /* ---- Grade report ---- */
  .g-head { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .g-ring { --c:#16a34a; width:64px; height:64px; border-radius:50%; flex:none; display:grid; place-items:center;
    background: conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0); }
  .g-ring span { width:50px; height:50px; border-radius:50%; background:var(--bg); display:grid; place-items:center;
    font-weight:700; font-size:16px; }
  .g-badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; }
  .g-sub { color:var(--muted); font-size:13px; margin-top:4px; }
  .g-card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; width:100%; box-sizing:border-box; }
  .g-label { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:4px; }
  .g-ans { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .g-mono { font-family: ui-monospace, Menlo, monospace; font-size:14px; word-break:break-word; }
  .g-check { font-size:13px; padding:8px 12px; border-radius:10px; margin-top:10px; }
  .g-step { border-left:4px solid var(--c); padding:6px 10px; margin:8px 0; }
  .g-step .w { font-family: ui-monospace, Menlo, monospace; font-size:13px; }
  .g-step .f { font-size:13px; color:var(--muted); margin-top:3px; }
  .g-structs { display:flex; gap:10px; flex-wrap:wrap; }
  .g-structs .mol svg { height:200px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.1.7/dist/smiles-drawer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const dark = () => (window.openai && window.openai.theme
    ? window.openai.theme === "dark"
    : window.matchMedia("(prefers-color-scheme: dark)").matches);
  const PALETTE = ["#2563eb", "#e11d48", "#16a34a", "#d97706", "#7c3aed", "#0891b2"];

  function showError(msg) { $("err").textContent = msg; }

  // ---------- Chemistry ----------
  function drawMolecules(data) {
    const stage = $("stage");
    const drawer = new SmilesDrawer.SmiDrawer({
      compactDrawing: false,
      explicitHydrogens: !!data.explicitHydrogens,
      terminalCarbons: !!data.terminalCarbons,
      bondThickness: 1.2,
      fontSizeLarge: 11,
      fontSizeSmall: 8,
    });
    const theme = dark() ? "dark" : "light";

    (data.molecules || []).forEach((m, i) => {
      const isRxn = m.smiles.includes(">");
      const box = document.createElement("div");
      box.className = isRxn ? "rxn" : "mol";
      const svgId = "s" + i;
      box.innerHTML = `<svg id="${svgId}" data-smiles=""></svg>` +
        (m.name ? `<div class="name">${escapeHtml(m.name)}</div>` : "") +
        (m.conditions ? `<div class="name">Conditions: ${escapeHtml(m.conditions)}</div>` : "");
      stage.appendChild(box);
      drawer.draw(m.smiles, "#" + svgId, theme, null,
        (e) => showError(`Could not parse SMILES for ${m.name || m.smiles}: ${e}`));
    });
  }

  // ---------- Math ----------
  function plot2D(data) {
    const div = document.createElement("div");
    div.className = "plot";
    $("stage").appendChild(div);
    const [x0, x1] = [data.xMin ?? -10, data.xMax ?? 10];
    const N = 800, traces = [];

    (data.functions || []).forEach((f, i) => {
      const code = math.compile(f.expr);
      const xs = [], ys = [];
      for (let k = 0; k <= N; k++) {
        const x = x0 + (x1 - x0) * k / N;
        let y;
        try { y = code.evaluate({ x }); } catch { y = NaN; }
        if (typeof y !== "number" || !isFinite(y) || Math.abs(y) > 1e6) y = null; // break at asymptotes
        xs.push(x); ys.push(y);
      }
      const color = PALETTE[i % PALETTE.length];
      traces.push({ x: xs, y: ys, mode: "lines", name: f.label || `y = ${f.expr}`,
        line: { color, width: 2.5, dash: f.dashed ? "dash" : "solid" } });

      // optional shaded area (integral) for this function
      if (f.shadeFrom != null && f.shadeTo != null) {
        const sx = [], sy = [];
        for (let k = 0; k <= 300; k++) {
          const x = f.shadeFrom + (f.shadeTo - f.shadeFrom) * k / 300;
          sx.push(x); sy.push(code.evaluate({ x }));
        }
        traces.push({ x: sx, y: sy, fill: "tozeroy", mode: "none", showlegend: false,
          fillcolor: color + "33", hoverinfo: "skip" });
      }
    });

    (data.points || []).forEach((p) => traces.push({
      x: [p.x], y: [p.y], mode: "markers+text", text: [p.label || ""], textposition: "top right",
      marker: { size: 9, color: dark() ? "#fff" : "#111" }, showlegend: false }));

    Plotly.newPlot(div, traces, layout(data, {
      xaxis: axis(data.xLabel || "x", [x0, x1]),
      yaxis: axis(data.yLabel || "y", data.yMin != null && data.yMax != null ? [data.yMin, data.yMax] : undefined),
    }), { responsive: true, displaylogo: false });
  }

  function plot3D(data) {
    const div = document.createElement("div");
    div.className = "plot";
    div.style.height = "480px";
    $("stage").appendChild(div);
    const code = math.compile(data.expr);
    const [x0, x1, y0, y1] = [data.xMin ?? -5, data.xMax ?? 5, data.yMin ?? -5, data.yMax ?? 5];
    const n = 80, xs = [], ys = [], zs = [];
    for (let i = 0; i <= n; i++) xs.push(x0 + (x1 - x0) * i / n);
    for (let j = 0; j <= n; j++) ys.push(y0 + (y1 - y0) * j / n);
    for (const y of ys) zs.push(xs.map((x) => {
      try { const z = code.evaluate({ x, y }); return isFinite(z) ? z : null; } catch { return null; }
    }));
    Plotly.newPlot(div, [{ type: "surface", x: xs, y: ys, z: zs, colorscale: "Viridis",
      contours: { z: { show: true, usecolormap: true, project: { z: true } } } }],
      layout(data, { scene: { xaxis: { title: "x" }, yaxis: { title: "y" }, zaxis: { title: "z" } } }),
      { responsive: true, displaylogo: false });
  }


  // ---------- Grading ----------
  const STATUS = {
    correct: { c: "#16a34a", icon: "✓", label: "Correct" },
    partially_correct: { c: "#d97706", icon: "◐", label: "Partially correct" },
    incorrect: { c: "#e11d48", icon: "✗", label: "Not quite" },
    minor_error: { c: "#d97706", icon: "!", label: "Minor error" },
  };
  const CHECK = {
    verified: { bg: "#16a34a22", fg: "#16a34a", t: "✓ Verified by math engine" },
    mismatch: { bg: "#e11d4822", fg: "#e11d48", t: "✗ Math engine found a difference" },
    inconclusive: { bg: "#d9770622", fg: "#d97706", t: "? Not auto-verifiable" },
    error: { bg: "#d9770622", fg: "#d97706", t: "? Couldn't auto-verify" },
  };

  function drawGrade(d) {
    const st = STATUS[d.verdict] || STATUS.incorrect, e = escapeHtml;
    const ringColor = d.score >= 85 ? "#16a34a" : d.score >= 50 ? "#d97706" : "#e11d48";
    let h = `<div style="width:100%">
      <div class="g-head">
        <div class="g-ring" style="--p:${Math.round(d.score)};--c:${ringColor}"><span>${Math.round(d.score)}</span></div>
        <div><span class="g-badge" style="background:${st.c}">${st.icon} ${st.label}</span>
          <div class="g-sub">${e(d.subject || "")}${d.keyConcept ? " · " + e(d.keyConcept) : ""}</div></div>
      </div>
      <div class="g-card"><div class="g-label">Problem</div><div>${e(d.problem)}</div></div>
      <div class="g-card"><div class="g-ans">
        <div><div class="g-label">Your answer</div><div class="g-mono" style="color:${st.c}">${e(d.studentAnswer)}</div></div>
        <div><div class="g-label">Correct answer</div><div class="g-mono">${e(d.correctAnswer)}</div></div>
      </div>`;
    if (d.check) {
      const c = CHECK[d.check.status] || CHECK.error;
      h += `<div class="g-check" style="background:${c.bg};color:${c.fg}"><b>${c.t}</b><br><span style="color:var(--fg)">${e(d.check.detail)}</span></div>`;
    }
    h += `</div>`;
    if (d.structures && (d.structures.studentSmiles || d.structures.correctSmiles)) {
      h += `<div class="g-card"><div class="g-label">Structures</div><div class="g-structs">` +
        (d.structures.studentSmiles ? `<div class="mol"><svg id="g-s"></svg><div class="name">Yours</div></div>` : "") +
        (d.structures.correctSmiles ? `<div class="mol"><svg id="g-c"></svg><div class="name">Correct</div></div>` : "") +
        `</div></div>`;
    }
    if (d.steps && d.steps.length) {
      h += `<div class="g-card"><div class="g-label">Step by step</div>` + d.steps.map((s, i) => {
        const ss = STATUS[s.status] || STATUS.incorrect;
        return `<div class="g-step" style="--c:${ss.c}"><div class="w"><b style="color:${ss.c}">${ss.icon}</b> ${i + 1}. ${e(s.work)}</div><div class="f">${e(s.feedback)}</div></div>`;
      }).join("") + `</div>`;
    }
    if (d.hint) h += `<div class="g-card"><div class="g-label">💡 Hint</div><div>${e(d.hint)}</div></div>`;
    if (d.nextProblem) h += `<div class="g-card"><div class="g-label">🎯 Try this next</div><div>${e(d.nextProblem)}</div></div>`;
    h += `</div>`;
    $("stage").innerHTML = h;

    if (d.structures) {
      const drawer = new SmilesDrawer.SmiDrawer({ bondThickness: 1.2, fontSizeLarge: 11, fontSizeSmall: 8 });
      const theme = dark() ? "dark" : "light";
      if (d.structures.studentSmiles) drawer.draw(d.structures.studentSmiles, "#g-s", theme, null, (er) => showError("Your structure: " + er));
      if (d.structures.correctSmiles) drawer.draw(d.structures.correctSmiles, "#g-c", theme, null, (er) => showError("Correct structure: " + er));
    }
  }

  function axis(title, range) {
    const c = dark() ? "#3a3a3d" : "#e3e5e8";
    return { title, range, gridcolor: c, zerolinecolor: dark() ? "#888" : "#999", zerolinewidth: 1.5 };
  }
  function layout(data, extra) {
    return Object.assign({
      margin: { l: 50, r: 20, t: 10, b: 45 },
      paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
      font: { color: dark() ? "#f2f2f2" : "#1d1d1f" },
      legend: { orientation: "h", y: -0.18 },
    }, extra);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Entry ----------
  let lastKey = null;
  function render() {
    const data = window.openai && window.openai.toolOutput;
    if (!data) return;
    const key = JSON.stringify(data);
    if (key === lastKey) return;
    lastKey = key;
    $("stage").innerHTML = ""; $("err").textContent = "";
    $("title").textContent = data.title || "";
    $("caption").textContent = data.caption || "";
    try {
      if (data.kind === "molecules") drawMolecules(data);
      else if (data.kind === "plot2d") plot2D(data);
      else if (data.kind === "plot3d") plot3D(data);
      else if (data.kind === "grade") drawGrade(data);
    } catch (e) { showError(String(e && e.message || e)); }
  }

  render();
  window.addEventListener("openai:set_globals", render);
})();
</script>
