<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<div id="root">
  <div id="title"></div>
  <div id="stage"></div>
  <div id="caption"></div>
  <div id="err"></div>
</div>

<style>
  :root {
    --bg:#ffffff; --fg:#16181d; --muted:#666b76; --card:#f7f8fa; --paper:#ffffff; --line:#e4e6eb; --accent:#2563eb;
    --good:#15803d; --warn:#b45309; --bad:#be123c; --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  :root[data-theme="dark"] {
    --bg:#1b1c1f; --fg:#eceef2; --muted:#a2a7b3; --card:#24262b; --paper:#202226; --line:#363941; --accent:#6ea0ff;
    --good:#4ade80; --warn:#fbbf24; --bad:#fb7185; --shadow:none;
  }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; }
  #root { padding:16px; max-width:980px; }
  #title { font-weight:650; font-size:16px; letter-spacing:-.01em; margin-bottom:12px; }
  #title:empty { display:none; }
  #caption { color:var(--muted); font-size:13px; margin-top:10px; line-height:1.5; }
  #err { color:var(--bad); font-size:13px; white-space:pre-wrap; margin-top:8px; }
  #stage { display:flex; flex-wrap:wrap; gap:12px; }
  .full { width:100%; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-sizing:border-box; }
  .label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .muted { color:var(--muted); }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .b-good { background:color-mix(in srgb, var(--good) 14%, transparent); color:var(--good); }
  .b-warn { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
  .b-bad { background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad); }

  /* molecules */
  .mol { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:var(--shadow);
    flex:1 1 220px; min-width:200px; display:flex; flex-direction:column; align-items:center; box-sizing:border-box; }
  .mol .svg { width:100%; display:flex; justify-content:center; }
  .mol svg { width:auto; max-width:100%; height:auto; }
  .mol .name { font-weight:600; font-size:14px; margin-top:4px; text-align:center; }
  .mol .meta { font-size:12.5px; color:var(--muted); margin-top:2px; text-align:center; }
  .mol .chk { margin-top:6px; text-align:center; font-size:12px; }
  .mol .detail { font-size:11.5px; color:var(--muted); margin-top:4px; text-align:center; max-width:320px; }

  /* reactions */
  .rxn { width:100%; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:var(--shadow);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; box-sizing:border-box; }
  .rxn { flex-wrap:nowrap; }
  .rxn .mol { box-shadow:none; border:none; background:transparent; flex:0 1 auto; min-width:0; padding:4px; }
  .rxn .mol svg { width:auto; max-width:100%; height:auto; }
  .rxn .mol .name { font-size:13px; }
  .rxn .notes { width:100%; text-align:center; font-size:12px; color:var(--muted); margin-top:4px; }
  .rxn .plus { font-size:22px; color:var(--muted); padding:0 4px; }
  .rxn .arrow { display:flex; flex-direction:column; align-items:center; min-width:110px; max-width:170px; padding:0 4px; flex:0 0 auto; }
  .rxn .arrow .t { font-size:12.5px; text-align:center; max-width:200px; line-height:1.35; min-height:17px; }
  .rxn .arrow svg { width:110px; height:22px; }
  .rxn .plus { flex:none; }
  @media (max-width:600px){ .rxn { flex-wrap:wrap; } }

  /* mechanisms */
  .step { width:100%; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); box-sizing:border-box; }
  .step .head { display:flex; align-items:center; gap:8px; }
  .step .num { background:var(--accent); color:#fff; border-radius:999px; font-size:11px; font-weight:700; width:20px; height:20px; display:inline-grid; place-items:center; flex:none; }
  .step .lab { font-weight:600; font-size:14px; }
  .step .svg { display:flex; justify-content:center; padding:6px 0; }
  .step svg { width:auto; max-width:100%; height:auto; }
  .step .note { font-size:13px; color:var(--muted); line-height:1.45; }
  .down { width:100%; display:flex; justify-content:center; color:var(--muted); margin:-4px 0; }

  /* plots */
  .plot { width:100%; height:430px; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:6px; font-size:14px; align-items:center; }
  .legend .it { display:flex; align-items:center; gap:8px; }
  .sw { width:22px; height:0; border-top:3px solid; border-radius:2px; flex:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:4px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .katex { font-size:1.05em; }

  /* animations */
  .a-ctrl { display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .a-ctrl button { background:var(--accent); color:#fff; border:none; border-radius:999px; padding:7px 16px; font-weight:600; cursor:pointer; font-size:13px; }
  .a-ctrl input[type=range] { flex:1; min-width:140px; accent-color:var(--accent); }
  .a-ctrl select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:4px 6px; }
  .a-read { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .a-read div { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:13px; }
  .a-read b { font-family: ui-monospace, Menlo, monospace; }
  .a-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; font-family: ui-monospace, Menlo, monospace; }
  .a-table td, .a-table th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:right; }

  /* grade */
  .g-head { display:flex; align-items:center; gap:14px; }
  .g-ring { width:64px; height:64px; border-radius:50%; flex:none; display:grid; place-items:center; background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0); }
  .g-ring span { width:50px; height:50px; border-radius:50%; background:var(--bg); display:grid; place-items:center; font-weight:700; font-size:17px; }
  .g-ans { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .g-ans { grid-template-columns:1fr; } }
  .g-math { font-size:15px; overflow-x:auto; padding:2px 0; }
  .g-check { font-size:13px; padding:9px 12px; border-radius:10px; margin-top:10px; line-height:1.45; }
  .g-step { border-left:3px solid var(--c); padding:6px 10px; margin:8px 0; }
  .g-step .w { font-size:13.5px; }
  .g-step .f { font-size:13px; color:var(--muted); margin-top:3px; line-height:1.45; }
  .stack { display:flex; flex-direction:column; gap:10px; width:100%; }

  /* progress */
  .p-tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:560px){ .p-tiles { grid-template-columns:repeat(2,1fr); } }
  .p-tile .v { font-size:26px; font-weight:700; letter-spacing:-.02em; }
  .p-tile .l { font-size:12px; color:var(--muted); }
  .p-row { display:grid; grid-template-columns:minmax(100px,1.3fr) 3fr 40px; align-items:center; gap:10px; margin:8px 0; font-size:13px; }
  .p-bar { height:9px; background:var(--line); border-radius:6px; overflow:hidden; }
  .p-bar > div { height:100%; border-radius:6px; }
  .p-act { display:grid; grid-template-columns:repeat(14,1fr); gap:4px; }
  .p-act div { aspect-ratio:1; border-radius:4px; }
  .p-recent { font-size:13px; display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .p-recent:last-child { border-bottom:none; }
</style>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const isDark = () => (window.openai && window.openai.theme ? window.openai.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tex = (t, display) => { try { return katex.renderToString(t, { throwOnError: false, displayMode: !!display }); } catch { return esc(t); } };
  const showError = (m) => { $("err").textContent = m; };
  const COLORS = ["#2563eb", "#e11d48", "#059669", "#d97706", "#7c3aed", "#0891b2"];
  const FEATURE = { "root": "#0284c7", "local max": "#16a34a", "local min": "#dc2626", "inflection": "#7c3aed", "y-intercept": "#64748b", "tangent point": "#d97706" };
  const niceTex = (s) => String(s).replace(/≈/g, "\\approx ").replace(/π/g, "\\pi ").replace(/√(\d+)/g, "\\sqrt{$1}");

  // Chemical formula → HTML with subscripts / superscript charge
  const formulaHtml = (f) => esc(f).replace(/(\d+)(?=[A-Z]|$|[+−])/g, "<sub>$1</sub>").replace(/(\d*[+−])$/, "<sup>$1</sup>");
  const svgFor = (o) => (isDark() ? o.dark : o.light) || "";

  function checkBadge(c) {
    if (!c) return "";
    if (c.status === "verified") return `<span class="badge b-good" title="${esc(c.detail)}">✓ Verified · PubChem</span>`;
    if (c.status === "corrected") return `<span class="badge b-warn" title="${esc(c.detail)}">⚠ Corrected from PubChem</span>`;
    return "";
  }
  function molCard(m) {
    const title = m.name || m.label || "";
    return `<div class="mol"><div class="svg">${svgFor(m)}</div>` +
      (title ? `<div class="name">${esc(title)}</div>` : "") +
      (m.name && m.label ? `<div class="meta">${esc(m.label)}</div>` : "") +
      `<div class="meta">${formulaHtml(m.formula)} · ${m.mw.toFixed(2)} g/mol</div>` +
      (checkBadge(m.check) ? `<div class="chk">${checkBadge(m.check)}</div>` : "") +
      (m.check && m.check.status === "corrected" ? `<div class="detail">${esc(m.check.detail)}</div>` : "") + `</div>`;
  }

  // ---------- Chemistry ----------
  function drawMolecules(d) { $("stage").innerHTML = d.items.map(molCard).join(""); }

  function rxnCard(m) {
    const title = m.name || m.label || "";
    const tick = m.check && m.check.status === "verified" ? ` <span style="color:var(--good)" title="${esc(m.check.detail)}">✓</span>` : m.check && m.check.status === "corrected" ? ` <span style="color:var(--warn)" title="${esc(m.check.detail)}">⚠</span>` : "";
    return `<div class="mol"><div class="svg">${svgFor(m)}</div>${title ? `<div class="name">${esc(title)}${tick}</div>` : ""}<div class="meta">${formulaHtml(m.formula)}</div></div>`;
  }
  function drawReaction(d) {
    const side = (list) => list.map(rxnCard).join(`<div class="plus">+</div>`);
    const col = css("--fg");
    const arrow = d.arrow === "equilibrium"
      ? `<svg viewBox="0 0 130 22"><path d="M4 7 H122 M114 2 L124 7" stroke="${col}" stroke-width="1.6" fill="none"/><path d="M126 15 H8 M16 20 L6 15" stroke="${col}" stroke-width="1.6" fill="none"/></svg>`
      : `<svg viewBox="0 0 130 22"><path d="M4 11 H120" stroke="${col}" stroke-width="1.8"/><path d="M114 5 L126 11 L114 17 Z" fill="${col}"/></svg>`;
    const corrected = [...d.reactants, ...d.products].filter((m) => m.check && m.check.status === "corrected");
    const notes = corrected.length ? `<div class="notes">⚠ ${corrected.map((m) => esc(m.check.detail)).join("<br>")}</div>` : "";
    setTimeout(() => { const n = document.querySelector(".rxn"); if (n && notes) n.insertAdjacentHTML("beforeend", notes); });
    $("stage").innerHTML = `<div class="rxn">${side(d.reactants)}<div class="arrow"><div class="t">${esc(d.reagents || "")}</div>${arrow}<div class="t muted">${esc(d.conditions || "")}</div></div>${side(d.products)}</div>`;
  }

  function drawMechanism(d) {
    const downArrow = `<svg width="16" height="22" viewBox="0 0 16 22"><path d="M8 1 V18 M3 13 L8 20 L13 13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>`;
    $("stage").innerHTML = d.steps.map((s, i) => (i ? `<div class="down">${downArrow}</div>` : "") +
      `<div class="step"><div class="head"><span class="num">${i + 1}</span><span class="lab">${esc(s.label || (i === d.steps.length - 1 ? "Product" : `Step ${i + 1}`))}</span></div>` +
      `<div class="svg">${svgFor(s)}</div>${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}</div>`).join("");
  }

  // ---------- Plot helpers ----------
  function axis(title, range) {
    return { title: { text: title || "", font: { size: 13 } }, range, gridcolor: css("--line"), zerolinecolor: isDark() ? "#8a8f99" : "#9aa1ad",
      zerolinewidth: 1.4, linecolor: css("--line"), ticks: "outside", tickcolor: css("--line"), automargin: true };
  }
  const baseLayout = (extra) => Object.assign({
    margin: { l: 48, r: 16, t: 8, b: 40 }, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { family: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif", color: css("--fg"), size: 12 },
    showlegend: false, hovermode: "closest", hoverlabel: { font: { size: 12 } },
  }, extra);
  const plotConfig = { responsive: true, displaylogo: false, displayModeBar: false };

  // ---------- 2D plots ----------
  function plot2D(d) {
    const wrap = document.createElement("div"); wrap.className = "full";
    wrap.innerHTML = `<div class="plot"></div><div class="legend"></div><div class="chips"></div>`;
    $("stage").appendChild(wrap);
    const traces = [], shapes = [], legend = [], chips = [];
    let [ylo, yhi] = d.yRange;
    const allPts = [];
    d.functions.forEach((f, i) => {
      const color = COLORS[i % COLORS.length];
      if (f.shade) traces.push({ x: f.shade.x, y: f.shade.y, fill: "tozeroy", mode: "none", fillcolor: color + "2e", hoverinfo: "skip" });
      traces.push({ x: f.x, y: f.y, mode: "lines", line: { color, width: 2.6, dash: f.dashed ? "dash" : "solid" }, connectgaps: false,
        hovertemplate: `(%{x:.4g}, %{y:.4g})<extra></extra>` });
      legend.push(`<span class="it"><span class="sw" style="border-color:${color};${f.dashed ? "border-top-style:dashed" : ""}"></span>${f.label ? esc(f.label) + ":&nbsp;" : ""}${tex((d.functions.length > 1 ? `f_{${i + 1}}(x)=` : "f(x)=") + f.tex)}</span>`);
      if (f.tangent) {
        traces.push({ x: f.tangent.x, y: f.tangent.y, mode: "lines", line: { color: FEATURE["tangent point"], width: 2, dash: "dash" }, hoverinfo: "skip" });
        legend.push(`<span class="it"><span class="sw" style="border-color:${FEATURE["tangent point"]};border-top-style:dashed"></span>tangent:&nbsp;${tex(f.tangent.tex)}</span>`);
        allPts.push(f.tangent.point);
      }
      if (f.shade) legend.push(`<span class="it"><span class="sw" style="border-top-width:10px;border-color:${color}55"></span>${tex(f.shade.tex)}</span>`);
      f.lines.forEach((l) => {
        shapes.push(l.x != null
          ? { type: "line", xref: "x", yref: "paper", x0: l.x, x1: l.x, y0: 0, y1: 1, line: { color: css("--muted"), width: 1.4, dash: "dot" } }
          : { type: "line", xref: "paper", yref: "y", x0: 0, x1: 1, y0: l.y, y1: l.y, line: { color: css("--muted"), width: 1.4, dash: "dot" } });
        chips.push(`<span class="chip"><span class="dot" style="background:${css("--muted")}"></span>${esc(l.kind)} ${tex(l.tex)}</span>`);
      });
      f.features.forEach((p) => allPts.push(p));
    });
    const labelled = new Set();
    const showText = allPts.length <= 10;
    const byKind = {};
    allPts.forEach((p) => {
      const key = p.x.toFixed(9) + "," + p.y.toFixed(9);
      p.label = labelled.has(key) ? "" : p.text; labelled.add(key);
      (byKind[p.kind] = byKind[p.kind] || []).push(p);
    });
    Object.entries(byKind).forEach(([kind, pts]) => {
      traces.push({ x: pts.map((p) => p.x), y: pts.map((p) => p.y), mode: showText ? "markers+text" : "markers",
        text: pts.map((p) => p.label), customdata: pts.map((p) => p.text), textposition: "top right", textfont: { size: 11, color: css("--fg") },
        marker: { size: 9, color: FEATURE[kind] || "#334155", line: { color: css("--bg"), width: 1.5 } },
        hovertemplate: `${kind} %{customdata}<extra></extra>` });
      if (kind !== "tangent point") pts.forEach((p) => chips.push(`<span class="chip"><span class="dot" style="background:${FEATURE[kind]}"></span>${esc(kind)} ${tex(niceTex(p.text))}</span>`));
      pts.forEach((p) => { ylo = Math.min(ylo, p.y); yhi = Math.max(yhi, p.y); });
    });
    (d.points || []).forEach((p) => {
      traces.push({ x: [p.x], y: [p.y], mode: "markers+text", text: [(p.ok ? "" : "⚠ ") + (p.label || "")], textposition: "top left",
        marker: { size: 9, color: p.ok ? css("--fg") : "#f59e0b", symbol: p.ok ? "circle" : "x" }, hovertemplate: `(%{x}, %{y})<extra></extra>` });
      ylo = Math.min(ylo, p.y); yhi = Math.max(yhi, p.y);
    });
    const pad = (yhi - ylo) * 0.04;
    Plotly.newPlot(wrap.querySelector(".plot"), traces, baseLayout({ shapes, xaxis: axis(d.xLabel || "x", d.xRange), yaxis: axis(d.yLabel || "y", [ylo - pad, yhi + pad]) }), plotConfig);
    wrap.querySelector(".legend").innerHTML = legend.join("");
    wrap.querySelector(".chips").innerHTML = chips.join("");
  }

  function plot3D(d) {
    const lg = document.createElement("div"); lg.className = "legend"; lg.innerHTML = tex("z = " + d.tex); $("stage").appendChild(lg);
    const div = document.createElement("div"); div.className = "plot"; div.style.height = "480px";
    $("stage").appendChild(div);
    Plotly.newPlot(div, [{ type: "surface", x: d.x, y: d.y, z: d.z, colorscale: "Viridis", showscale: true, colorbar: { thickness: 12, len: 0.7 },
      contours: { z: { show: true, usecolormap: true, project: { z: true }, width: 2 } }, lighting: { ambient: 0.7, diffuse: 0.6, specular: 0.15 } }],
      baseLayout({ margin: { l: 0, r: 0, t: 0, b: 0 }, scene: { xaxis: { title: "x", gridcolor: css("--line") }, yaxis: { title: "y", gridcolor: css("--line") }, zaxis: { title: "z", gridcolor: css("--line") }, camera: { eye: { x: 1.6, y: 1.5, z: 0.9 } } } }), plotConfig);
  }

  // ---------- Animations ----------
  function drawAnimation(d) {
    const f = math.compile(d.expr);
    const F = (x) => { try { const y = f.evaluate({ x }); return typeof y === "number" && isFinite(y) ? y : NaN; } catch { return NaN; } };
    const wrap = document.createElement("div"); wrap.className = "full";
    wrap.innerHTML = `<div class="legend">${tex("f(x) = " + d.tex)}</div><div class="plot" style="height:380px"></div><div class="a-ctrl"><button>▶ Play</button><input type="range"><span class="a-lab" style="font-size:13px;min-width:110px"></span></div><div class="a-read"></div><div class="a-extra"></div>`;
    $("stage").appendChild(wrap);
    const plot = wrap.querySelector(".plot"), btn = wrap.querySelector("button"), slider = wrap.querySelector("input"),
      lab = wrap.querySelector(".a-lab"), read = wrap.querySelector(".a-read"), extra = wrap.querySelector(".a-extra");
    const curve = (x0, x1) => { const xs = [], ys = []; for (let k = 0; k <= 800; k++) { const x = x0 + (x1 - x0) * k / 800; xs.push(x); const y = F(x); ys.push(isNaN(y) || Math.abs(y) > 1e6 ? null : y); } return { x: xs, y: ys }; };
    const fmt = (v) => (isFinite(v) ? (+v.toPrecision(7)).toString() : "undefined");
    const base = { mode: "lines", line: { color: COLORS[0], width: 2.6 }, hoverinfo: "skip" };
    const lay = (x) => baseLayout(Object.assign({ xaxis: axis("x"), yaxis: axis("y") }, x));
    let setStep;
    if (d.type === "riemann") {
      const a = d.a, b = d.b, pad = (b - a) * 0.15, x0 = d.xMin ?? a - pad, x1 = d.xMax ?? b + pad;
      let exact = 0; const N = 2000, hh = (b - a) / N;
      for (let i = 0; i <= N; i++) exact += F(a + i * hh) * (i === 0 || i === N ? 1 : i % 2 ? 4 : 2);
      exact *= hh / 3;
      extra.innerHTML = `<div class="a-ctrl"><span style="font-size:13px">Method</span><select>${["left", "right", "midpoint", "trapezoid"].map((m) => `<option ${m === (d.method || "midpoint") ? "selected" : ""}>${m}</option>`).join("")}</select></div>`;
      const sel = extra.querySelector("select");
      slider.min = 1; slider.max = 60; slider.value = 4;
      const c = curve(x0, x1);
      setStep = () => {
        const n = +slider.value, m = sel.value, dx = (b - a) / n, px = [], py = [], nx = [], ny = []; let sum = 0;
        for (let i = 0; i < n; i++) {
          const l = a + i * dx, r = l + dx; let poly;
          if (m === "trapezoid") { const yl = F(l), yr = F(r); sum += (yl + yr) / 2 * dx; poly = [[l, 0], [l, yl], [r, yr], [r, 0], [l, 0]]; }
          else { const xs = m === "left" ? l : m === "right" ? r : (l + r) / 2, y = F(xs); sum += y * dx; poly = [[l, 0], [l, y], [r, y], [r, 0], [l, 0]]; }
          const pos = poly[1][1] + poly[2][1] >= 0, X = pos ? px : nx, Y = pos ? py : ny;
          poly.forEach(([x, y]) => { X.push(x); Y.push(y); }); X.push(null); Y.push(null);
        }
        Plotly.react(plot, [
          { x: px, y: py, fill: "toself", mode: "lines", line: { color: "#059669", width: 1 }, fillcolor: "#05966938", hoverinfo: "skip" },
          { x: nx, y: ny, fill: "toself", mode: "lines", line: { color: "#e11d48", width: 1 }, fillcolor: "#e11d4838", hoverinfo: "skip" },
          Object.assign({}, base, c)], lay({ xaxis: axis("x", [x0, x1]) }), plotConfig);
        lab.textContent = `n = ${n} rectangles`;
        read.innerHTML = `<div>${m} sum: <b>${fmt(sum)}</b></div><div>exact ∫: <b>${fmt(exact)}</b></div><div>error: <b>${fmt(Math.abs(sum - exact))}</b></div>`;
      };
      sel.onchange = setStep;
    } else if (d.type === "secant_tangent") {
      const x0p = d.x0, x0 = d.xMin ?? x0p - 4, x1 = d.xMax ?? x0p + 4, y0 = F(x0p);
      let slopeT; try { slopeT = math.derivative(d.expr, "x").evaluate({ x: x0p }); } catch { slopeT = (F(x0p + 1e-6) - F(x0p - 1e-6)) / 2e-6; }
      const c = curve(x0, x1), ys = c.y.filter((v) => v != null), yr = [Math.min(...ys), Math.max(...ys)], ypad = (yr[1] - yr[0]) * 0.1 || 1;
      slider.min = 0; slider.max = 100; slider.value = 0;
      setStep = () => {
        const h = 3 * Math.pow(10, -3.5 * slider.value / 100), x1q = x0p + h, y1 = F(x1q), m = (y1 - y0) / h;
        const L = (m_, col, dash) => ({ x: [x0, x1], y: [y0 + m_ * (x0 - x0p), y0 + m_ * (x1 - x0p)], mode: "lines", line: { color: col, width: 2, dash }, hoverinfo: "skip" });
        Plotly.react(plot, [Object.assign({}, base, c), L(slopeT, "#059669", "dash"), L(m, "#e11d48", "solid"),
          { x: [x0p, x1q], y: [y0, y1], mode: "markers+text", text: ["P", "Q"], textposition: ["bottom right", "top left"], marker: { size: 10, color: [css("--fg"), "#e11d48"] } }],
          lay({ xaxis: axis("x", [x0, x1]), yaxis: axis("y", [yr[0] - ypad, yr[1] + ypad]) }), plotConfig);
        lab.textContent = `h = ${fmt(h)}`;
        read.innerHTML = `<div style="color:#e11d48">secant slope: <b>${fmt(m)}</b></div><div style="color:#059669">f′(${x0p}) = <b>${fmt(slopeT)}</b></div><div>difference: <b>${fmt(Math.abs(m - slopeT))}</b></div>`;
      };
    } else {
      const x0p = d.x0, x0 = d.xMin ?? x0p - 3, x1 = d.xMax ?? x0p + 3, fx0 = F(x0p), c = curve(x0, x1);
      slider.min = 0; slider.max = 100; slider.value = 0;
      setStep = () => {
        const dd = 2 * Math.pow(10, -4 * slider.value / 100), xl = x0p - dd, xr = x0p + dd, yl = F(xl), yr = F(xr), est = (yl + yr) / 2;
        const traces = [Object.assign({}, base, c),
          { x: [xl, xr], y: [yl, yr], mode: "markers", marker: { size: 11, color: ["#7c3aed", "#d97706"] }, hovertemplate: "(%{x:.6g}, %{y:.6g})<extra></extra>" },
          { x: [xl, xl, null, xr, xr], y: [0, yl, null, 0, yr], mode: "lines", line: { color: css("--muted"), dash: "dot", width: 1 }, hoverinfo: "skip" }];
        if (isNaN(fx0) && isFinite(est)) traces.push({ x: [x0p], y: [est], mode: "markers", marker: { size: 12, color: "rgba(0,0,0,0)", line: { color: COLORS[0], width: 2 } }, hoverinfo: "skip" });
        else if (isFinite(fx0) && Math.abs(fx0 - est) > 1e-3 * Math.max(1, Math.abs(est))) traces.push({ x: [x0p], y: [fx0], mode: "markers", marker: { size: 9, color: COLORS[0] } });
        Plotly.react(plot, traces, lay({ xaxis: axis("x", [x0, x1]) }), plotConfig);
        lab.textContent = `distance = ${fmt(dd)}`;
        read.innerHTML = `<div style="color:#7c3aed">f(${fmt(xl)}) = <b>${fmt(yl)}</b></div><div style="color:#d97706">f(${fmt(xr)}) = <b>${fmt(yr)}</b></div><div>f(${x0p}) = <b>${fmt(fx0)}</b></div>`;
      };
      const rows = [1, 0.1, 0.01, 0.001, 0.0001];
      extra.innerHTML = `<table class="a-table"><tr><th>x → ${x0p}⁻</th><th>f(x)</th><th>x → ${x0p}⁺</th><th>f(x)</th></tr>` +
        rows.map((r) => `<tr><td>${fmt(x0p - r)}</td><td>${fmt(F(x0p - r))}</td><td>${fmt(x0p + r)}</td><td>${fmt(F(x0p + r))}</td></tr>`).join("") + `</table>`;
    }
    slider.oninput = setStep;
    let timer = null;
    btn.onclick = () => {
      if (timer) { clearInterval(timer); timer = null; btn.textContent = "▶ Play"; return; }
      if (+slider.value >= +slider.max) slider.value = slider.min;
      btn.textContent = "❚❚ Pause";
      timer = setInterval(() => { slider.value = +slider.value + 1; setStep(); if (+slider.value >= +slider.max) { clearInterval(timer); timer = null; btn.textContent = "▶ Replay"; } }, d.type === "riemann" ? 220 : 60);
    };
    setStep();
  }

  // ---------- Grading ----------
  const STATUS = {
    correct: { c: "var(--good)", icon: "✓", label: "Correct" }, partially_correct: { c: "var(--warn)", icon: "◐", label: "Partially correct" },
    incorrect: { c: "var(--bad)", icon: "✗", label: "Not quite" }, minor_error: { c: "var(--warn)", icon: "!", label: "Minor error" },
  };
  const CHECK = { verified: ["b-good", "✓ Verified by math engine"], mismatch: ["b-bad", "✗ Math engine found a difference"], inconclusive: ["b-warn", "? Not auto-verifiable"], error: ["b-warn", "? Couldn't auto-verify"] };
  const scoreColor = (v) => (v >= 85 ? "var(--good)" : v >= 60 ? "var(--warn)" : "var(--bad)");

  function drawGrade(d) {
    const st = STATUS[d.verdict] || STATUS.incorrect;
    const ans = (t, raw) => (t ? `<div class="g-math">${tex(t)}</div>` : `<div class="g-math">${esc(raw)}</div>`);
    let h = `<div class="stack"><div class="g-head"><div class="g-ring" style="--p:${Math.round(d.score)};--c:${scoreColor(d.score)}"><span>${Math.round(d.score)}</span></div>
      <div><span class="badge" style="background:color-mix(in srgb, ${st.c} 15%, transparent);color:${st.c}">${st.icon} ${st.label}</span>
      <div class="muted" style="font-size:13px;margin-top:5px">${esc(d.subject)}${d.keyConcept ? " · " + esc(d.keyConcept) : ""}</div></div></div>
      <div class="card"><div class="label">Problem</div><div style="line-height:1.5">${esc(d.problem)}</div></div>
      <div class="card"><div class="g-ans"><div><div class="label">Your answer</div><div style="color:${st.c}">${ans(d.studentTex, d.studentAnswer)}</div></div>
      <div><div class="label">Correct answer</div>${ans(d.correctTex, d.correctAnswer)}</div></div>`;
    if (d.check) {
      const c = CHECK[d.check.status] || CHECK.error;
      const what = d.check.mode === "derivative" && d.check.expectedTex ? `<div style="margin-top:4px">${tex("\\frac{d}{dx}\\left[\\text{original}\\right] = " + d.check.expectedTex)}</div>`
        : d.check.mode === "antiderivative" && d.check.yoursTex ? `<div style="margin-top:4px">${tex("\\frac{d}{dx}\\left[\\text{your answer}\\right] = " + d.check.yoursTex)}</div>` : "";
      const detail = d.check.status === "mismatch" ? (d.check.detail.match(/At .*$/) || [d.check.detail])[0] : d.check.status === "verified" ? "Your answer matches at every tested point." : d.check.detail;
      h += `<div class="g-check ${c[0]}"><b>${c[1]}</b>${what}<div style="color:var(--fg);margin-top:3px">${esc(detail)}</div></div>`;
    }
    h += `</div>`;
    if (d.structures && (d.structures.student || d.structures.correct)) {
      const s = d.structures;
      const card = (o, t, ok) => o ? `<div class="mol"><div class="svg">${svgFor(o)}</div><div class="name" style="color:${ok}">${t}</div><div class="meta">${formulaHtml(o.formula)}</div></div>` : "";
      h += `<div class="card"><div class="label">Structures ${s.same != null ? (s.same ? `<span class="badge b-good">✓ identical (RDKit)</span>` : `<span class="badge b-bad">✗ different (RDKit)</span>`) : ""}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">${card(s.student, "Yours", s.same === false ? "var(--bad)" : "var(--fg)")}${card(s.correct, "Correct", "var(--fg)")}</div></div>`;
    }
    if (d.steps && d.steps.length) h += `<div class="card"><div class="label">Step by step</div>` + d.steps.map((s, i) => {
      const ss = STATUS[s.status] || STATUS.incorrect;
      return `<div class="g-step" style="--c:${ss.c}"><div class="w"><b style="color:${ss.c}">${ss.icon}</b> ${i + 1}. ${esc(s.work)}</div><div class="f">${esc(s.feedback)}</div></div>`;
    }).join("") + `</div>`;
    if (d.hint) h += `<div class="card"><div class="label">💡 Hint</div><div style="line-height:1.5">${esc(d.hint)}</div></div>`;
    if (d.nextProblem) h += `<div class="card"><div class="label">🎯 Try this next</div><div style="line-height:1.5">${esc(d.nextProblem)}</div></div>`;
    $("stage").innerHTML = h + `</div>`;
  }

  // ---------- Progress ----------
  function drawProgress(d) {
    if (!d.total) { $("stage").innerHTML = `<div class="card full">No graded work yet. Send a math, physics or chemistry problem to be graded and your progress will appear here.</div>`; return; }
    const tile = (v, l) => `<div class="card p-tile"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    const row = (t) => `<div class="p-row"><div>${esc(t.topic)} <span class="muted">×${t.attempts}</span> ${t.trend > 3 ? `<span style="color:var(--good)">▲</span>` : t.trend < -3 ? `<span style="color:var(--bad)">▼</span>` : ""}</div><div class="p-bar"><div style="width:${t.avg}%;background:${scoreColor(t.avg)}"></div></div><div style="text-align:right;font-weight:600">${t.avg}</div></div>`;
    const maxC = Math.max(1, ...d.activity.map((a) => a.count));
    let h = `<div class="stack"><div class="p-tiles">${tile(d.total, "Problems graded")}${tile(`<span style="color:${scoreColor(d.avgScore)}">${d.avgScore}</span>`, "Average score")}${tile(d.accuracy + "%", "Fully correct")}${tile((d.streak ? "🔥 " : "") + d.streak, "Day streak")}</div>`;
    if (d.weakTopics.length) h += `<div class="card" style="border-color:color-mix(in srgb, var(--bad) 40%, var(--line))"><div class="label">🎯 Focus on these</div>${d.weakTopics.map(row).join("")}</div>`;
    h += `<div class="card"><div class="label">All topics</div>${d.topics.map(row).join("")}</div>`;
    h += `<div class="card"><div class="label">Last 14 days</div><div class="p-act">${d.activity.map((a) => `<div title="${a.day}: ${a.count}" style="background:${a.count ? `color-mix(in srgb, var(--accent) ${25 + 75 * a.count / maxC}%, transparent)` : "var(--line)"}"></div>`).join("")}</div></div>`;
    h += `<div class="card"><div class="label">Recent</div>${d.recent.map((r) => `<div class="p-recent"><div>${esc(r.topic || r.subject)}<div class="muted" style="font-size:12px">${esc(r.problem)}</div></div><div style="color:${scoreColor(r.score)};font-weight:700">${r.score}</div></div>`).join("")}</div>`;
    if (!d.persistent) h += `<div class="muted" style="font-size:12px">History is stored temporarily and resets when the server restarts (add Upstash to keep it).</div>`;
    $("stage").innerHTML = h + `</div>`;
  }

  // ---------- Entry ----------
  let lastKey = null;
  function render() {
    const data = window.openai && window.openai.toolOutput;
    document.documentElement.setAttribute("data-theme", isDark() ? "dark" : "light");
    if (!data) return;
    const key = JSON.stringify(data) + isDark();
    if (key === lastKey) return;
    lastKey = key;
    $("stage").innerHTML = ""; $("err").textContent = "";
    $("title").textContent = data.title || "";
    $("caption").textContent = data.caption || "";
    const fn = { molecules: drawMolecules, reaction: drawReaction, mechanism: drawMechanism, plot2d: plot2D, plot3d: plot3D,
      animate: drawAnimation, grade: drawGrade, progress: drawProgress }[data.kind];
    try { fn ? fn(data) : showError("Unknown result type."); } catch (e) { showError(String((e && e.message) || e)); }
  }
  render();
  window.addEventListener("openai:set_globals", render);
})();
</script>
